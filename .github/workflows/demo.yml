# Publishes the skylight folder to GitHub Pages as the live demo. In a browser, js/mock-tizen.js
# stands in for the TV's API, so the app runs as it is.
name: Live demo

on:
  push:
    branches: [main]
    paths: ['skylight/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skylight
      - id: deployment
        uses: actions/deploy-pages@v4
